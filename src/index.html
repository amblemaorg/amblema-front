<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>AmbLeMa</title>
    <base href="/" />
    <meta name="robots" content="index, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="geo.region" content="VE" />
    <meta name="geo.placename" content="Venezuela" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Google Maps: se carga bajo demanda (GoogleMapsLoaderService) -->
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2V3026X7L8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      gtag('config', 'G-2V3026X7L8');
    </script>
    <!-- Sin JS, el loader prerenderizado nunca se ocultaría -->
    <noscript><style>.page-loader { display: none !important; }</style></noscript>
    <script>
      // Respaldo: si Angular no arrancó en 10 s (p. ej. falla un bundle JS), se oculta el loader
      // prerenderizado. Angular borra los style[ng-transition] del servidor al arrancar; si siguen
      // ahí, el loader visible es el del HTML estático y no el del cliente.
      setTimeout(function () {
        if (!document.querySelector('style[ng-transition]')) { return; }
        var loader = document.querySelector('.page-loader--visible');
        if (loader) { loader.style.display = 'none'; }
      }, 10000);
    </script>
  </head>
  <body>
    <app-root>
      <div style="background-color: #00809a; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; position: fixed; top: 0; left: 0; z-index: 99999;">
        <img src="assets/images/amblema-loader.webp" style="width: 20em;" alt="Cargando..." />
      </div>
    </app-root>
  </body>
</html>
