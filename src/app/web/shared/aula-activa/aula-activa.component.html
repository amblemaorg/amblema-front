<section #section class="aula-activa" [ngClass]="'aula-activa--' + theme">
  <div class="aula-activa__text">
    <h2 class="aula-activa__title"><span class="bold">Aula</span> Activa</h2>
    <p class="aula-activa__description">{{ text }}</p>
  </div>
  <div class="aula-activa__icon" aria-hidden="true">
    <svg-icon class="aula-activa__svg" name="aaa-icon"></svg-icon>
  </div>
</section>
