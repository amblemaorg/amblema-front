<section #section class="aula-activa" [ngClass]="'aula-activa--' + theme">
  <div class="aula-activa__text">
    <h2 class="aula-activa__title"><span class="bold">Aula</span> Activa AmbLeMa</h2>
    <p class="aula-activa__description">{{ text }}</p>
  </div>

  <div class="aula-activa__gallery" *ngIf="gallery.length; else puzzleIcon">
    <!-- En SSR solo la primera foto: el carrusel (jQuery) se monta en el navegador -->
    <owl-carousel
      *ngIf="isBrowser; else firstImage"
      class="aula-activa-carousel"
      [options]="galleryOptions"
      [carouselClasses]="['']"
    >
      <div class="image-wrapper" *ngFor="let slide of gallery; index as i">
        <img [src]="slide.image" [alt]="'Aula Activa AmbLeMa, foto ' + (i + 1)" loading="lazy" />
        <p class="image-description" *ngIf="slide.description">{{ slide.description }}</p>
      </div>
    </owl-carousel>

    <ng-template #firstImage>
      <div class="image-wrapper">
        <img [src]="gallery[0].image" alt="Aula Activa AmbLeMa, foto 1" loading="lazy" />
        <p class="image-description" *ngIf="gallery[0].description">{{ gallery[0].description }}</p>
      </div>
    </ng-template>
  </div>

  <ng-template #puzzleIcon>
    <div class="aula-activa__icon" aria-hidden="true">
      <svg-icon class="aula-activa__svg" name="aaa-icon"></svg-icon>
    </div>
  </ng-template>
</section>
