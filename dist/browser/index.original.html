    <script>
      // Respaldo: si Angular no arrancó en 10 s (p. ej. falla un bundle JS), se oculta el loader
      // prerenderizado. Angular borra los style[ng-transition] del servidor al arrancar; si siguen
      // ahí, el loader visible es el del HTML estático y no el del cliente.

        var loader = document.querySelector('.page-loader--visible');
        if (loader) { loader.style.display = 'none'; }
      }, 10000);
    </script>
